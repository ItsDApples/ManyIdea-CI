config_factory#fruit_trees:
  blueprint:
    items:
      "manyidea:${fruit}_sapling":
        material: oak_sapling
        texture: "manyidea:item/${fruit}_sapling"
        data:
          item_name: "<!i><green>${zh}树苗</green>"
        behavior:
          type: block_item
          block: manyidea:${fruit}_sapling

      "manyidea:${fruit}_leaves":
        material: oak_leaves
        texture: "manyidea:item/${fruit}_leaves"
        data:
          item_name: "<!i><green>${zh}树叶</green>"
        behavior:
          type: block_item
          block: manyidea:${fruit}_leaves

    blocks:
      "manyidea:${fruit}_sapling":
        state:
          auto_state: lower_tripwire
          model:
            path: "manyidea:block/${fruit}_sapling"
            generation:
              parent: "minecraft:block/cross"
              textures:
                cross: "manyidea:block/${fruit}_sapling"
        settings:
          hardness: 0
          resistance: 0
          push_reaction: DESTROY
          sounds:
            break: minecraft:block.grass.break
          tags:
            - minecraft:mineable/axe

      "manyidea:${fruit}_leaves":
        state:
          auto_state: note_block
          model:
            texture: "manyidea:block/${fruit}_leaves"
        settings:
          hardness: 0.2
          resistance: 0.2
          push_reaction: DESTROY
          sounds:
            break: minecraft:block.grass.break
          tags:
            - minecraft:mineable/hoe

  instances:
    - {fruit: pear,        zh: 梨树,   en: Pear}
    - {fruit: hawberry,    zh: 山楂树, en: Hawberry}
    - {fruit: lychee,      zh: 荔枝树, en: Lychee}
    - {fruit: mango,       zh: 芒果树, en: Mango}
    - {fruit: persimmon,   zh: 柿子树, en: Persimmon}
    - {fruit: peach,       zh: 桃树,   en: Peach}
    - {fruit: orange,      zh: 橙树,   en: Orange}
    - {fruit: apple,       zh: 苹果树, en: Apple}
    - {fruit: mangosteen,  zh: 山竹树, en: Mangosteen}
    - {fruit: bayberry,    zh: 杨梅树, en: Bayberry}
    - {fruit: kiwi,        zh: 猕猴桃树, en: Kiwi}
    - {fruit: fig,         zh: 无花果树, en: Fig}
    - {fruit: durian,      zh: 榴莲树,  en: Durian}

config_factory#crates:
  blueprint:
    items:
      "manyidea:${crop}_crate":
        material: oak_planks
        model: "manyidea:block/${crop}_crate"
        data:
          item_name: "<!i><gold>${zh}箱</gold>"
        behavior:
          type: block_item
          block: manyidea:${crop}_crate

    blocks:
      "manyidea:${crop}_crate":
        state:
          auto_state: note_block
          model:
            path: "manyidea:block/${crop}_crate"
            generation:
              parent: "minecraft:block/cube_bottom_top"
              textures:
                side: "manyidea:block/${crop}_crate_side"
                bottom: "manyidea:block/crate_bottom"
                top: "manyidea:block/${crop}_crate_top"
        settings:
          hardness: 2
          resistance: 3
          push_reaction: DESTROY
          sounds:
            break: minecraft:block.wood.break
            step: minecraft:block.wood.step
            place: minecraft:block.wood.place
            hit: minecraft:block.wood.hit
            fall: minecraft:block.wood.fall
          tags:
            - minecraft:mineable/axe

  instances:
    - {crop: carrot,   zh: 胡萝卜}
    - {crop: potato,   zh: 土豆}
    - {crop: beetroot, zh: 甜菜根}
    - {crop: cabbage,  zh: 卷心菜}
    - {crop: tomato,   zh: 番茄}
    - {crop: onion,    zh: 洋葱}
