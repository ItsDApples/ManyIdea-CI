blueprint:
  items:
    "manyidea:${fruit}_jelly_block":
      material: slime_block
      model:
        path: "manyidea:block/jelly_block"
        tints:
          - type: minecraft:constant
            value: "${color_str}"
      data:
        item_name: "<!i><gold>${zh}果酱块</gold>"
      behavior:
        type: block_item
        block: manyidea:${fruit}_jelly_block

    "manyidea:${fruit}_jello_block":
      material: honey_block
      model:
        path: "manyidea:block/jello_block"
        tints:
          - type: minecraft:constant
            value: "${color_str}"
      data:
        item_name: "<!i><gold>${zh}果冻块</gold>"
      behavior:
        type: block_item
        block: manyidea:${fruit}_jello_block

  blocks:
    "manyidea:${fruit}_jelly_block":
      state:
        auto_state: note_block
        model:
          path: "manyidea:block/jelly_block"
      settings:
        hardness: 0.5
        resistance: 0.5
        push_reaction: DESTROY
        sounds:
          break: minecraft:block.slime_block.break
          step: minecraft:block.slime_block.step
          place: minecraft:block.slime_block.place
          hit: minecraft:block.slime_block.hit
          fall: minecraft:block.slime_block.fall
        tags:
          - minecraft:mineable/sword

    "manyidea:${fruit}_jello_block":
      state:
        auto_state: note_block
        model:
          path: "manyidea:block/jello_block"
      settings:
        hardness: 0.3
        resistance: 0.3
        push_reaction: DESTROY
        sounds:
          break: minecraft:block.honey_block.break
          step: minecraft:block.honey_block.step
          place: minecraft:block.honey_block.place
          hit: minecraft:block.honey_block.hit
          fall: minecraft:block.honey_block.fall
        tags:
          - minecraft:mineable/sword

